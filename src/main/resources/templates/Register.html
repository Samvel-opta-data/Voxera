<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren | VOXERA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <div class="logo">VOXERA</div>
    <div class="nav-buttons">
        <button title="Home" onclick="window.location.href='/'">🏠</button>
        <button title="Impressum" onclick="window.location.href='/impressum'">ⓘ</button>
    </div>
</nav>
<main>
    <section class="hero">
        <h1>Registrieren</h1>

        <p>
            Registrieren Sie sich jetzt bei VOXERA und starten Sie mit dem Chatten und Videoanrufen!
        </p>

        <form th:action="@{/register}" method="post" class="card" style="width:400px;">

            <input type="text" name="username" placeholder="Benutzername oder E-Mail" required>

            <br><br>

            <input type="password" name="password" placeholder="Passwort" required>

            <br><br>

            <input type="password" name="password2" placeholder="Passwort wiederholen" required>

            <button class="cta" type="submit">
                Registrieren
            </button>

            <button class="cta" type="button" onclick="window.location.href='/login'">
                Bereits ein Konto? Einloggen!
            </button>

        </form>
    </section>
</main>

<div class="camera-widget" id="cameraWidget" hidden>
    <video id="cameraPreview" autoplay playsinline muted></video>
    <div class="camera-label">Kamera-Vorschau</div>
    <div class="camera-error" id="cameraError"></div>
</div>

<script>
    (function () {
        const cameraButton = document.getElementById('cameraButton');
        const cameraWidget = document.getElementById('cameraWidget');
        const cameraPreview = document.getElementById('cameraPreview');
        const cameraError = document.getElementById('cameraError');
        let cameraStream = null;

        async function toggleCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
                cameraPreview.srcObject = null;
                cameraWidget.hidden = true;
                cameraWidget.classList.remove('error');
                cameraButton.classList.remove('active');
                cameraButton.setAttribute('aria-pressed', 'false');
                cameraError.textContent = '';
                return;
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                cameraPreview.srcObject = cameraStream;
                cameraWidget.hidden = false;
                cameraWidget.classList.remove('error');
                cameraButton.classList.add('active');
                cameraButton.setAttribute('aria-pressed', 'true');
                cameraError.textContent = '';
            } catch (error) {
                cameraWidget.hidden = false;
                cameraWidget.classList.add('error');
                cameraError.textContent = 'Kamera konnte nicht gestartet werden. Bitte Browser-Berechtigung prüfen.';
                cameraButton.classList.remove('active');
                cameraButton.setAttribute('aria-pressed', 'false');
                console.error(error);
            }
        }

        cameraButton.addEventListener('click', toggleCamera);
        window.addEventListener('beforeunload', () => {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
        });
    })();
</script>
</body>
</html>
