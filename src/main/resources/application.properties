spring.application.name=Voxera

# Server
server.port=8080

# Logging
logging.level.root=INFO

# Actuator
management.endpoints.web.exposure.include=health,info

# management system health details
management.endpoint.health.show-details=always

# Devtools
spring.devtools.restart.enabled=true

# H2 Database (Disabled - using MySQL)
#spring.datasource.url=jdbc:h2:mem:voxeradb;DB_CLOSE_DELAY=-1
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true

#MySQL Database (Disabled by default, uncomment to use)
spring.datasource.url=jdbc:mysql://localhost:3306/Voxera?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true